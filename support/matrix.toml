[[row]]
id = "rust.atomic-global"
area = "language"
group = "Rust"
name = "Atomic statics as the globals of data coupling"
state = "caveats"
example = "rust-lib"
evidence = "examples/rust-lib/src/state.rs:17"
pattern = 'pub static ALTITUDE: AtomicI32'
proof = "crates/ingest/tests/e2e_rust_constructs.rs::the_atomic_statics_are_globals_of_the_data_coupling"
caveat = "At -Copt-level=0 every access is a call into core::sync::atomic, so a function is recorded as taking the static's address, not as reading or writing it. Which functions those are is asserted on macOS/AArch64 and x86-64 Linux only; elsewhere the test asserts only that the statics are globals of the image."

[[row]]
id = "rust.fn-pointer-table"
area = "language"
group = "Rust"
name = "Dispatch through a table of fn pointers"
state = "caveats"
example = "rust-lib"
evidence = "examples/rust-lib/src/sched.rs:31"
pattern = 'static TASKS: \[fn\(i32\) -> i32'
proof = "crates/ingest/tests/e2e_rust_constructs.rs::the_task_table_dispatch_is_an_indirect_call"
caveat = "The call is an indirect-branch gap whose candidates are the functions its caller takes the address of and those held in any data it reads, each table read as far as its symbol extends; here the caller takes no address, so they are the table's. An ELF symbol has a size, so on x86-64 Linux they are exactly the three; a Mach-O symbol has none, so on macOS the table is read up to the next data symbol and the candidates take in the std vtables after it. That the table's entries are among them, and are held by the table, is asserted on macOS/AArch64 and x86-64 Linux only. In a position-independent ELF image the table's words are `R_*_RELATIVE` relocations the file holds as zero; they are read through the relocation, and until #325 G1 they were not, so on Linux the call had no candidates."

[[row]]
id = "rust.no-std-bare-metal"
area = "language"
