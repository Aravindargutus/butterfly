[[row]]
id = "c.dynamic-frame"
area = "language"
group = "C"
name = "Dynamic stack frames: alloca and variable-length arrays"
state = "caveats"
example = "c-constructs"
evidence = "examples/c-constructs/constructs.c:23"
pattern = 'int buf\[n\];'
proof = "crates/ingest/tests/c_constructs.rs::a_vla_and_an_alloca_are_unbounded_without_the_su"
caveat = "A VLA and an alloca are reported not bounded, reason \"dynamic frame (alloca / VLA)\", and so is every caller above them; the worst case shown is the static part of the frame. The `.su` says so where there is one; without it (and `.stack_sizes` leaves such functions out) the run-time `sp` write is recognised in the function body -- until #168 that path reported the VLA bounded by its static frame. The body scan knows clang's AArch64, x86-64, Arm and RISC-V shapes and errs towards dynamic within them (a register-sized adjustment it cannot tell from a VLA reads as dynamic), but a shape within them it does not know reads as a static frame; on any other architecture the prologue is not read either, so without a `.su` the frame is unknown and the stack is not bounded. Its x86-64 shape was checked on clang's disassembly here, and runs on an ingested x86-64 image only in hosted CI. On AArch64 Darwin such a function calls the stack probe `___chkstk_darwin` through its GOT slot (`adrp`/`ldr`/`blr x16`); the slot is resolved to the symbol the image binds it to, so the probe is a direct, runtime-check helper call and not a function-pointer call -- until #271 it read as an indirect call. The same resolution covers ELF `R_*_GLOB_DAT` slots (AArch64 `adrp`/`ldr`/`blr`, x86-64 `call *foo@GOTPCREL(%rip)`), checked here on lld-linked images and in unit tests, not on an ingested ELF image in this example, and, in a position-independent ELF image, `.got` slots an `R_*_RELATIVE` relocation fills with the start of a function of the image (#325)."

[[row]]
id = "c.goto"
area = "language"
group = "C"
name = "goto"
state = "caveats"
example = "c-constructs"
evidence = "examples/c-constructs/constructs.c:59"
pattern = 'goto undo_a;'
proof = "crates/ingest/tests/c_constructs.rs::goto_paths_are_edges_and_the_untaken_ones_are_uncovered"
caveat = "A goto is an ordinary jump in the object-code graph: a cleanup path, a backward retry and a goto into a loop body (irreducible flow) all come out with no block called unreachable, the never-taken gotos and their labels' code uncovered, and the back edge covered. The shared return block of `goto_cleanup` borrows the closing brace, which llvm-cov counts inside the zero-count `undo_a:` label; it is projected covered by inference, because the covered `return rc;` block (the only code of its line, no call) jumps to it unconditionally, and shown as `shared-line` with that reasoning. Until #270 it read uncovered. The rule proves entry only along such an edge: a shared return reached only from blocks whose own evidence is shared, or through a call, keeps the projection of its borrowed line."

