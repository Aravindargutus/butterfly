[[row]]
id = "rust.generics"
area = "language"
group = "Rust"
name = "Generic functions and their monomorphised copies"
state = "caveats"
example = "rust-constructs"
evidence = "examples/rust-constructs/constructs.rs:14"
pattern = 'pub fn limit<T: PartialOrd \+ Copy>'
proof = "crates/ingest/tests/rust_constructs.rs::each_monomorphised_copy_is_projected_from_its_own_record"
caveat = "Each copy (`limit::<i32>`, `limit::<u64>`) is a function of its own, with its own symbol, branch record, line figures and object-code projection. The file's source view is the sum over the copies, as llvm-cov makes it: a line reads covered there if any copy ran it. Copies that share one name (the same crate built twice) are merged into one function instead."

[[row]]
id = "rust.dyn-dispatch"
area = "language"
group = "Rust"
name = "Trait objects and dyn dispatch"
state = "caveats"
example = "rust-constructs"
evidence = "examples/rust-constructs/constructs.rs:63"
pattern = 'law\.apply\(x\)'
proof = "crates/ingest/tests/rust_constructs.rs::a_dyn_call_is_an_indirect_branch_and_the_impls_behind_it_are_not_dead"
caveat = "The call through the vtable is an indirect-branch gap with no static candidates: the vtable arrives as an argument, so the target set is not resolved (as for cpp.virtual-dispatch). The impls it reaches have no direct caller and are not reported dead, because their vtables hold their addresses; that, and that the call has no static candidates, is asserted on macOS/AArch64 and x86-64 Linux only. On Linux a vtable's words are `R_*_RELATIVE` relocations the file holds as zero; until #325 G1 they were not read, and every such impl was a dead-code candidate there. An impl whose type is never built (Bypass here) has no vtable, and rustc emits no code for it."

[[row]]
id = "rust.macro-rules"
area = "language"
group = "Rust"
name = "macro_rules! expansions that contain decisions"
state = "caveats"
example = "rust-constructs"
evidence = "examples/rust-constructs/constructs.rs:105"
pattern = 'if \$v >= \$lo && \$v <= \$hi'
proof = "crates/ingest/tests/rust_constructs.rs::a_macro_expanded_decision_lands_on_the_definition_with_no_count"
caveat = "rustc emits no branch region for a condition inside a macro expansion, so the decision's outcomes are not in the source coverage at all. The image's line table puts the expanded code on the macro's definition, not on each use, so every use lands on that one line. That line has no count: its object code is projected neither covered nor uncovered and carries not-instrumented and extra-object-branch gaps, while the using lines read covered. Only a trace measures the outcomes (see rust.level-a-route)."

