pattern = 'switch \(op\)'
proof = "crates/ingest/tests/jump_table.rs::the_o0_switch_is_read_through_its_table"
caveat = "A sixteen-case switch compiled to a jump table at -O0 and -O2: the table is read from the image, each case is an edge from the indirect branch, no case block is called unreachable and no case region a predicated decision. Only clang's table shapes are read (AArch64 word, halfword and byte entries; x86-64 32-bit offsets), and the x86-64 path has been run here on Mach-O and on rust-lld-linked x86-64 Linux ELF images of this example; until #325 the ELF disassembly's single-`#` comment hid the table's address, so no ELF table was read. Any other shape leaves the branch unresolved. The indirect branch stays a gap for a reviewer to confirm the table is the switch's. A small switch like examples/c's `phase_name` compiles to compares on AArch64; on x86-64 clang lowers it to a table too, which is read the same way."

