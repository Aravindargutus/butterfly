[[row]]
id = "c.varargs"
area = "language"
group = "C"
name = "Variadic functions defined by the project"
state = "caveats"
example = "c-constructs"
evidence = "examples/c-constructs/constructs.c:161"
pattern = 'int sum_ints\(int count, \.\.\.\)'
proof = "crates/ingest/tests/c_constructs.rs::a_variadic_function_has_a_bounded_frame_and_an_untracked_va_list"
caveat = "A variadic function has a static, bounded frame, its `va_arg` loop is an ordinary decision, and nothing is called unreachable. `va_start` takes the `va_list`'s address, so what `va_arg` reads through it is not attributed, and the variable says so. On AArch64 Darwin `va_list` is a plain pointer; on x86-64 (and AAPCS64 Linux) clang's `va_arg` branches between the register save area and the stack, and the prologue tests `%al` before saving vector registers: compiler branches with no source decision, which by butterfly's rules would be `extra-object-branch` gaps, with the stack-area path projected covered from its line when the run never took it. That shape was read from clang's x86-64 disassembly here, not from an ingested x86-64 image."

[[row]]
id = "c.control-flow-macro"
area = "language"
group = "C"
name = "Macros that expand to control flow"
state = "caveats"
example = "c-constructs"
evidence = "examples/c-constructs/constructs.c:180"
pattern = '#define REQUIRE\(cond\)'
proof = "crates/ingest/tests/c_constructs.rs::a_decision_inside_a_macro_is_placed_at_the_macro_use"
caveat = "llvm-cov locates a macro's branch regions at the #define; butterfly places them at the macro's use, where the object code is, so each use is a decision on its own line and its never-run `return` is projected uncovered. Until #168 they were dropped: the object branches read as compiler-generated and the never-run return projected covered from the use line. A multi-condition (MC/DC) decision inside a macro is placed at the use as well, its conditions in the #define's order; until #269 it was reported at the #define line as a predicated decision with no object code. The LLVM 18 export layout (Apple clang 17, clang 18) names no file for an MC/DC decision, so it is recovered from where the decision's conditions lie; when that does not settle it (two uses of one macro in a function with different MC/DC results) the decision is not shown and a caveat names it. The LLVM 19+ layout, which states the file, is covered by unit tests only: no host here exports it. Everything a macro expands to shares its use line, so which part of the expansion an instruction implements is inferred, not read."

