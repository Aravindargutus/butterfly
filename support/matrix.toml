#
# What butterfly supports, one row per language construct, tool feature,
# toolchain and architecture -- and what backs each claim (#38, #151).
#
# The rule: no claim of support without a worked example. Three states:
#
#   supported      butterfly analyses it and the output is meaningful. Needs
#                  an example CI builds, and a test that reads that example.
#   caveats        it works, but something is approximated, under-reported or
#                  not yet proven end to end. Needs an example AND the limit
#                  written down in `caveat`.
#   not-supported  not claimed. Needs a one-line `reason`. "Not yet
#                  demonstrated" lives here too: a code path with no example
#                  is not a claim, and `tracking` names the issue that would
#                  promote it.
#
# crates/ingest/tests/support_matrix.rs checks every row on every `cargo
# test`; support/README.md says how to add one. Three fixed phrases are read
# by that check: a caveat must say "not built in CI" to lean on an example CI
# does not build, "verified locally, not in hosted CI" to lean on an example
# declared local-only below, and "no test" to stand without a `proof`.
#
# Surveyed against main @ c496599 (2026-09-18).

schema = 1

# ═══════════════════════════════════════════════════ local-only examples
#
# scripts/ci-local.sh mirrors .github/workflows/ci.yml, and the check holds
# them to it: the hosted build list must equal the local one MINUS the
# examples declared here. Nothing else may differ. A declaration is
#
#   [[local_only]]
#   example = "<directory under examples/>"
#   reason = "<why hosted CI does not build it>"      # required
#   tracking = [<issues>]
#
# and it costs the example something: every row it backs is `caveats` at
# best, and says "verified locally, not in hosted CI". The day ci.yml builds
# the example the declaration fails the check, and once it is removed so does
# the phrase -- neither can outlive the gap.
#

[[local_only]]
example = "rust-qemu"
reason = "Needs qemu-system-aarch64, a nightly with llvm-tools and the aarch64-unknown-none-softfloat target: about 220 MB to install on every hosted run, and hosted minutes are billed. scripts/ci-local.sh builds it wherever those are present and reports a named SKIP where they are not."
tracking = [147, 164]

