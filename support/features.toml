[[feature]]
id = "V06"
issue = 178
group = "evidence"
title = "MC/DC"
status = "captured"
fixtures = ["c"]
claim = """
For each decision: its conditions, how often each was true and false, and \
whether each condition's independence was shown. The decision at `demo.c:23` \
in `examples/c` has {{c.conditionsTotal}} conditions, of which \
{{c.conditionsProven}} are proven; for the one that is not, the tab says which \
input is missing. With an llvm-cov that exports test vectors the tab also lists the recorded vectors and, for each condition a pair of executed vectors isolates, that pair."""
limits = [
  "Needs upstream LLVM/clang ≥ 18 with `-fcoverage-mcdc`. Apple clang numbers itself separately from upstream, so its version is not a guide: the compiler that produced the MC/DC data on this page ({{c.compiler}}) writes the LLVM 18 MC/DC record layout.",
  "An export in the LLVM 18 MC/DC record layout carries no decision outcome counts and no test vectors: the truth table is empty and the evidence says so in a caveat. Independence per condition is still exact. That is the state captured on this host.",
  "GCC's -fcondition-coverage is not MC/DC and is not presented as MC/DC.",
  "Rust has no MC/DC: nightly rustc accepts `-Zcoverage-options=branch|condition` but rejects `mcdc`, so no Rust build here produces MC/DC records and none are inferred. The tab has no Rust-specific message, and does not name the toolchain as the reason: a Rust function's decision list is simply empty, so the tab shows the generic \"Branch regions without MC/DC records\" table, or \"No decisions in this function.\" when the function has no branch regions either.",
]

