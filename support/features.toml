# ───────────────────────── what we do not claim ─────────────────────────────
#
# Rendered as its own section, ahead of the matrix's not-supported rows. Each
# entry names where the project itself says so: this list restates the
# project's position, it does not invent one.

[[not_claimed]]
text = "butterfly is not qualified. There is no DO-330 qualification data for it today, and nothing on this page is a claim of certification, of compliance, or of certification credit."
source = "docs/qualification/DO-330-assessment.md"

[[not_claimed]]
text = "Object-code coverage is projected from source coverage through the line table unless an execution trace was imported. Projected green means \"implied by source coverage\", not \"executed\". One example imports a trace — `examples/rust-qemu`, shown in V28, and not built by hosted CI (#164) — and every other example on this page is projected only."
source = "README.md, \"Projected, measured, and the gap between them\""

[[not_claimed]]
text = "butterfly does not perform the source-to-object review (Table A-7 objective 9). A human does; butterfly presents instruction-level evidence for it and records the verdict. Neither projected nor measured coverage constitutes that review."
source = "docs/qualification/DO-330-assessment.md"

[[not_claimed]]
text = "A gap is a finding, never a verdict, and a recorded resolution is validated, not verified."
source = "README.md, \"What it shows\""

[[not_claimed]]
text = "Exploratory builds (`butterfly build`) are never certification evidence. The evidence that counts comes from your configuration-controlled build."
source = "README.md, \"Exploratory builds and variant comparison\""

[[not_claimed]]
text = "The Variables panel attributes accesses only on AArch64, and only for a variable the debug info places in one frame slot, which is what an unoptimised (-O0) build produces; it numbers accesses in static instruction order, which is not execution order. An empty list carrying a reason means \"could not tell\"; an empty list with no reason asserts that no instruction in the function addresses the variable's frame slot through the base register the debug info gives for it."
source = "ui/browser/checks/vars.cjs, crates/ingest/tests/vars.rs"

[[not_claimed]]
text = "No MC/DC from GCC (-fcondition-coverage is not MC/DC) and none from Rust (the instrumentation was removed upstream)."
source = "README.md, \"MC/DC does not come from GCC\" for the first; \"Rust (e.g. the ARINC 653 kernel)\" for the second"

[[not_claimed]]
text = "Of `butterfly check`'s thresholds, only --min-lines and --min-outcomes read the evidence alone; the others also count recorded resolutions. --min-lines is line coverage, a proxy for statement coverage."
source = "README.md, \"Gating a build\""

[[not_claimed]]
text = "RISC-V has code paths, some of them unit-tested on hand-written instruction lists, but no example, so it is not supported; PE/COFF has no example and no handling beyond recognising its header, so it is not supported either. Neither is shown on this page."
source = "issue #161"

[[not_claimed]]
text = "The built-in server has no TLS and no per-client rate limiting: it only caps how many of its expensive requests run at once. Both belong to a reverse proxy in front of it."
source = "README.md, \"Security posture\"; SECURITY.md"

[[not_claimed]]
text = "The disassembly, the coverage export and the line table come from llvm-objdump, llvm-cov or gcov, and your compiler — external tools that butterfly reads and does not qualify."
source = "docs/qualification/DO-330-assessment.md §6.6"
