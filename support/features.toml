[[feature]]
id = "V28"
issue = 164
group = "evidence"
title = "Measured object-code coverage from an execution trace"
status = "captured"
claim = """
With an execution trace imported beside the coverage export, the Object tab \
shows each instruction under a projection and under a measurement, and they \
can disagree. Neither is always there to show: an instruction the line table \
places nowhere carries no projection — {{rust-qemu.executedUnknown}} of \
`examples/rust-qemu`'s instructions ran with none — and an instruction the \
trace never reached carries no count, which is what the Measured overlay \
draws as never executed. The trace of `examples/rust-qemu` \
({{rust-qemu.traceFormat}}) executed \
{{rust-qemu.instructionsMeasuredCovered}} of the evidence's \
{{rust-qemu.instructionsTotal}} instructions and took \
{{rust-qemu.outcomeEdgesMeasured}} of its {{rust-qemu.outcomeEdgesTotal}} \
branch outcomes; it disagrees with the projection at \
{{rust-qemu.disagreements}} instructions, of which \
{{rust-qemu.projectedNotExecuted}} are projected covered and never ran. \
`monitor::sum` is that case in one screen: its source coverage is complete \
at {{rust-qemu.fn.flight_qemu::monitor::sum.linesCovered}}/\
{{rust-qemu.fn.flight_qemu::monitor::sum.linesTotal}} lines, and \
{{rust-qemu.fn.flight_qemu::monitor::sum.blocksNeverExecuted}} of its \
{{rust-qemu.fn.flight_qemu::monitor::sum.blocks}} basic blocks were never \
entered — the bounds-check and overflow-panic paths `rustc` emits for its \
indexing and its arithmetic. The Object tab shows the same blocks under the \
Projected and the Measured overlay."""
fixtures = ["rust-qemu"]
limits = [
  "Measured coverage says which instructions executed. It is not the source-to-object review: an instruction can execute and still be wrong.",
  "The trace comes from QEMU (`-d in_asm,exec,nochain`), which is not a qualified tool, and the measurement is only as good as the trace. An emulator is not the target.",
  "The coverage export comes from an instrumented host build and the trace from the non-instrumented target build of the same sources, joined by demangled name. Projected and measured are comparable only because both runs execute the same campaign on the same sources; that is a property of this example, not of the tool.",
  "Code that exists only on the target — the entry point, the panic handler — and code `rustc` does not instrument has no coverage record and so no function page. The Overview lists it as code in the image without source-coverage evidence, with its own executed-in-trace column: for that code the trace is the only coverage there is.",
  "examples/rust-qemu is verified locally; hosted CI does not build it, because it needs QEMU and a bare-metal target (#147, #164). The hosted workflow excuses this example from its no-skips rule by name.",
]

# The two shots below are a comparison, so they are scrolled to the SAME
# block: B8, one of the three the trace never entered. Without that they
# showed the function's entry block, where the two overlays agree, and the
# contradiction the section exists for was below the fold in both (#229).
# `data-block` rather than the caption text, because the caption is the thing
# that differs between the two modes.
#
# `expect` is checked inside the published crop, which is the code pane: the
# footer is not in it, so "Projected, not measured" is asserted by
# v28-footer-measured's own shot and by ui/browser/checks/footer.cjs, not
# here.
[[feature.shot]]
file = "v28-projected"
route = "#/fn/{fn:flight_qemu::monitor::sum}/object"
seed = {sl-mode = "projected"}
steps = [{wait = "table.obj tr.i"}, {scroll = "tr.blk[data-block=\"8\"]", block = "center"}]
expect = ["projected covered"]
clip = [".pane >> nth=0"]
# Not "every instruction is implied covered": of this function's instructions
# some carry no source line at all and are shown as unknown, never as
# covered. What the projection really says here is that no block is left
# uncovered, because every source line of the function was executed by the
# instrumented run -- which is the statement the Measured shot contradicts.
caption = "monitor::sum under the Projected overlay, at the block the next screenshot contradicts: that block, like every block in view, is projected covered, because every one of its {{rust-qemu.fn.flight_qemu::monitor::sum.linesTotal}} source lines was executed by the instrumented run."

[[feature.shot]]
file = "v28-measured"
route = "#/fn/{fn:flight_qemu::monitor::sum}/object"
seed = {sl-mode = "measured"}
steps = [{wait = "table.obj tr.i"}, {scroll = "tr.blk[data-block=\"8\"]", block = "center"}]
expect = ["measured never executed", "measured executed"]
clip = [".pane >> nth=0"]
caption = "The same blocks under the Measured overlay: {{rust-qemu.fn.flight_qemu::monitor::sum.blocksNeverExecuted}} of them are marked measured never executed, over source the instrumented run covered in full."

# The two shots above are clipped to the code pane, so neither of them shows
# the bar at the foot of the page. V22 claims that bar can read "measured and
# not projected", and until this example existed nothing on this page backed
