#
# The feature showcase, as data (#154, part of #150).
#
# One [[feature]] per section of docs/showcase/index.html. The page is built
# from this file and from what `scripts/showcase/capture.cjs` records when it
# runs the commands and drives the viewer written down here -- so the rule of
# the epic is mechanical: NOTHING APPEARS ON THE PAGE UNLESS THE SCRIPT CAN
# REPRODUCE IT.
#
# Not under docs/: a docs-only change skips CI by design (#147), and an edit
# to a claim must not.
#
# ── How an entry is read ────────────────────────────────────────────────────
#
#   [fixture.NAME]   an example, the commands that build it (run VERBATIM from
#                    the repository root, and printed verbatim in the
#                    "Reproduce it" block), the evidence `butterfly serve` is
#                    given, and `ci`: is it built by hosted CI? (false => the
#                    page says "verified locally; not built in hosted CI")
#
#   [[feature]]      id V01..V27 (the epic's numbering; V28 was added by #164), its section issue,
#                    claim, limits, fixtures, and status:
#                      captured  the script shows it
#                      pending   blocked_by says which issue it waits for; the
#                                page renders "not yet demonstrated"
#
#   [[feature.cmd]]  a command run verbatim after the fixtures' own. `exit` is
#                    the status it must end with (a refusal is a feature: 3
#                    and 1 are expected below); `show = true` puts its real
#                    output on the page; `expect` are strings that output
#                    must contain.
#
#   [[feature.shot]] a screenshot: `route` (URL hash), `seed` (localStorage
#                    before the viewer starts), `steps` (Playwright selectors:
#                    click, hover, fill+value, select+value, press, wait,
#                    wait_gone, pause, scroll, move, wheel, drag), `expect` (text
#                    the page must show -- a caption is a claim too), `clip`
#                    (crop to these elements), `requires` (a captured fact
#                    that must hold on this host, else the shot is rendered
#                    as "not captured on this host" with `requires_reason`).
#                    `{fn:NAME}` / `{file:NAME}` resolve to ids from
#                    /api/evidence: never hard-code an id.
#
#   {{fixture.path}} in a claim, limit, caption or expectation is a number
#                    read from the evidence at capture time (facts.cjs). A
#                    number is never typed in here.
#
# ── Writing a claim ─────────────────────────────────────────────────────────
#
# The readers audit for a living. Say what the screenshot shows and stop.
# Coverage colour is PROJECTED unless a trace was imported; the Variables
# numbering is STATIC instruction order; the source-to-object review is done
# by a HUMAN; exploratory builds are never certification evidence; the tool
# is NOT qualified. No "certified", no "compliant", no superlatives.

[[group]]
id = "evidence"
title = "Reading the evidence"
[[group]]
id = "trace"
title = "Requirements and change"
[[group]]
id = "builds"
title = "Builds, baselines and reports"
[[group]]
id = "automation"
title = "From the terminal and in CI"
[[group]]
id = "trust"
title = "What you are trusting"
[[group]]
id = "use"
title = "Getting around and getting started"

