[BF-STACK-001]
statement = "When build-info.txt declares -fstack-usage, ingest gives an analysed function a .su frame only from records assigned to the file that defines it: a record is assigned only when its path matches exactly one of the defining files of the functions sharing its name, and the function needs at least one assigned record for each distinct address it occupies. A same-named function's record from another file, a record whose path cannot tell two units apart, or one unit's record for a header function that several units emit, does not satisfy a missing record; ingest then refuses the directory and names the function. A symbol sharing an address with a recorded function shares its frame. When every unit's records are present, ingest accepts the directory, and removing any one .su file from a shell adapter's output makes ingest refuse it."
tests = ["crates/ingest/tests/build_mode_invariants.rs"]
