#
# The committed showcase page is what its inputs say it is (#154).
#
# docs/showcase/index.html is generated by scripts/showcase/build.cjs from
# support/features.toml and docs/showcase/capture.json, and committed. Nothing
# ran the generator in CI, so the "GENERATED, do not edit" comment at the top
# of the page was the only thing keeping it equal to its inputs -- and an edit
# to the builder, or to a claim in features.toml, could land with the committed
# page still describing the previous one (review of #212).
#
# This job rebuilds the page from the capture ALREADY IN THE TREE and requires
# the result to be byte-identical to what is committed. That is enough to catch
# the whole class the review found: a figure paired to the wrong capture, a
# "captured" chip over an image that is not on disk, a counter that disagrees
# with what is rendered -- each of them changes the bytes.
#
# It is a separate workflow, and deliberately so:
#
#   * ci.yml ignores docs/** (#147), so a change to the committed page runs
#     nothing there. Here docs/showcase/** is a trigger.
#   * it needs node and NOTHING else -- no cargo, no clang, no LLVM, no
#     Playwright and no capture run. Seconds of a Linux minute, which is what
#     keeps it off the billed path that matters (the 45-minute test job).
#
# What it does not do is take screenshots: that needs the examples built and a
# browser, and it is what `scripts/showcase.sh` is for, run locally before the
# page is committed.
name: showcase

on:
  push:
    branches: [main]
    paths:
      - "docs/showcase/**"
      - "scripts/showcase.sh"
      - "scripts/showcase/**"
      - "support/features.toml"
      - "support/matrix.toml"
      # the two documents the matrix is rendered into: an edit to either
      # generated block must run the drift check, or it could land disagreeing
      # with the matrix (#153, review of #260). ci.yml ignores **/*.md and
      # docs/**, so nothing else covers a change to only these.
      - "README.md"
      - "docs/butterfly.html"
      - ".github/workflows/showcase.yml"
  # Hosted minutes are budgeted (#308): only pull requests into main start
  # a run, and only once they are ready for review (the draft guard on
  # every job below); stacked and draft pull requests are validated with
  # scripts/ci-local.sh instead.
  pull_request:
    branches: [main]
    # `edited` is for one transition only: a ready pull request stacked on
    # another branch, retargeted to main, emits `edited` and nothing else.
    # Any other edit (title, description) is filtered out by the job guard
    # and kept out of the concurrency group of real runs (#309 review).
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "docs/showcase/**"
      - "scripts/showcase.sh"
      - "scripts/showcase/**"
      - "support/features.toml"
      - "support/matrix.toml"
      - "README.md"
      - "docs/butterfly.html"
      - ".github/workflows/showcase.yml"

concurrency:
  # an edit that changed nothing but text runs in a group of its own, so it
  # can never cancel (or queue behind) a real run (#309 review)
  group: showcase-${{ github.event_name }}-${{ github.ref }}${{ (github.event.action == 'edited' && !github.event.changes.base) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebuild:
    # a draft is work in progress, validated locally, and an `edited` event
    # counts only when it retargeted the base; skipped jobs cost nothing (#308)
    if: ${{ !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base) }}
    name: the page is what its inputs say
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The rules support/features.toml is held to, the TOML reader, and the
      # builder's refusals. No browser, no compiled example.
      - name: The generator's own tests
        run: |
          node --test ui/showcase_toml.test.cjs
          node --test ui/showcase_build.test.cjs
          node --test ui/showcase_capture.test.cjs

      # The support tables in README.md and docs/butterfly.html are generated
      # from support/matrix.toml and may not drift from it (#153). This runs
      # the same drift check `node scripts/showcase/matrix-docs.cjs --check`
      # runs, in both directions: it fails whether the matrix or either
      # generated block was edited without regenerating the other. With the two
      # documents now among this workflow's triggers, a docs-only edit that
      # would otherwise run no job at all is covered here.
      - name: The README and manual match the support matrix
        run: node --test ui/matrix_docs.test.cjs

      - name: Rebuild docs/showcase/index.html from the committed capture
        run: node scripts/showcase/build.cjs --dir docs/showcase

      - name: It must be byte-identical to what is committed
        run: |
          if ! git --no-pager diff --exit-code -- docs/showcase/index.html; then
            echo "::error file=docs/showcase/index.html::docs/showcase/index.html is not what scripts/showcase/build.cjs produces from support/features.toml and docs/showcase/capture.json. Do not edit it by hand: run scripts/showcase.sh and commit what it writes."
            exit 1
          fi
