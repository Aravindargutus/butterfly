[package]
name = "butterfly"
description = "DO-178C structural-coverage and object-code evidence browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "butterfly"
path = "src/main.rs"

[dependencies]
butterfly-model = { path = "../model" }
butterfly-ingest = { path = "../ingest" }
butterfly-view = { path = "../view" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
serde = { workspace = true }

[dev-dependencies]
# The one place that decides what a missing fixture means (#227). Test-only:
# nothing in src/ touches it.
butterfly-testsupport = { path = "../testsupport" }
